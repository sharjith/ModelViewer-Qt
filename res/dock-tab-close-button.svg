<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Same glyph as Qt-ADS's own :/ads/images/close-button.svg, just #707070
     instead of hardcoded #000000 - the original has effectively no contrast
     against this app's dark theme (palette(light) is auto-computed from a
     dark base, since ThemeManager never assigns QPalette::Light explicitly).
     #707070 matches this app's own established "muted but legible" gray,
     already used for dock tab labels (see MainWindow.cpp's
     dockManagerStyleOverrides). -->
