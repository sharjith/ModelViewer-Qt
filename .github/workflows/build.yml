name: CI Build

on:
  push:
    branches: [ master, dev ]
    tags: [ 'Release-*' ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:
    inputs:
      os:
        description: 'Limit to one OS (leave as "all" to run the full matrix)'
        type: choice
        default: 'all'
        options: [ all, ubuntu-latest, windows-latest ]
      build_type:
        description: 'Limit to one build type (leave as "all" to run both)'
        type: choice
        default: 'all'
        options: [ all, Release, Debug ]
      debug_ssh:
        description: 'Open an SSH (tmate) session if this run fails, for live debugging'
        type: boolean
        default: false

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  compute-matrix:
    # Computes the actual matrix to run. On push/PR (or workflow_dispatch with
    # inputs left as "all"), this is the full 3-OS x 2-build_type cross
    # product, same as before. On workflow_dispatch with a specific os/
    # build_type chosen, it's narrowed to just that combination - job-level
    # `if:` conditions can't reference `matrix.*` to filter legs after the
    # fact, so the matrix itself has to be built with only what's wanted.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
    - id: set
      shell: bash
      env:
        INPUT_OS: ${{ github.event.inputs.os || 'all' }}
        INPUT_BUILD_TYPE: ${{ github.event.inputs.build_type || 'all' }}
      run: |
        python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
        import json, os

        os_input = os.environ["INPUT_OS"]
        bt_input = os.environ["INPUT_BUILD_TYPE"]

        # macos-latest dropped: Apple deprecated OpenGL (this app's rendering
        # backend) with no further investment, so macOS CI coverage isn't
        # worth the vcpkg/toolchain flakiness it kept hitting.
        all_os = [
            {"os": "ubuntu-latest", "triplet": "x64-linux", "mono": "mono"},
            {"os": "windows-latest", "triplet": "x64-windows", "mono": ""},
        ]
        all_build_types = ["Release", "Debug"]

        oses = all_os if os_input == "all" else [o for o in all_os if o["os"] == os_input]
        build_types = all_build_types if bt_input == "all" else [bt_input]

        matrix = [dict(o, build_type=bt) for o in oses for bt in build_types]

        print(f"matrix={json.dumps(matrix)}")
        PYEOF

  build:
    needs: compute-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      # Since the switch to the system-packages build (see CMakePresets.json's
      # linux_system_* presets and packaging/linux/vendor/), this only needs
      # the actual libraries ModelViewer links against directly, plus basic
      # build tooling - it no longer needs to build Qt/OpenCASCADE/gperf/etc
      # from source the way the old full-vcpkg Linux build did, so the
      # X11/mesa dev headers, tcl/tk, and autoconf/automake/libtool that were
      # only there for those source builds are gone too. Only OpenImageDenoise
      # and basisu are still vendored (no apt package exists for either) -
      # see the "Install vendor vcpkg dependencies" step below.
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          curl \
          zip \
          unzip \
          tar \
          git \
          gcc \
          g++ \
          qt6-base-dev \
          qt6-tools-dev \
          qt6-image-formats-plugins \
          libocct-foundation-dev \
          libocct-modeling-data-dev \
          libocct-modeling-algorithms-dev \
          libocct-data-exchange-dev \
          libocct-ocaf-dev \
          libembree-dev \
          libassimp-dev \
          libmeshoptimizer-dev \
          libopenexr-dev \
          libfreetype-dev \
          libglm-dev \
          libwebp-dev \
          libjpeg-turbo8-dev \
          libtbb-dev \
          imagemagick \
          dpkg-dev

    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Ninja (Windows)
      if: runner.os == 'Windows'
      run: choco install ninja -y --no-progress

    - name: Setup environment for vcpkg
      run: |
        echo "VCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/vcpkg/triplets" >> $GITHUB_ENV
        echo "VCPKG_DEFAULT_TRIPLET=${{ matrix.triplet }}" >> $GITHUB_ENV

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'dd3097e305afa53f7b4312371f62058d2e665320'
        runVcpkgInstall: false

    - name: Install vcpkg dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        ${{ github.workspace }}/vcpkg/vcpkg install --triplet=${{ matrix.triplet }} --x-manifest-root=. --x-install-root=./build/vcpkg_installed

    - name: Install vendor vcpkg dependencies (Linux)
      if: runner.os == 'Linux'
      # OpenImageDenoise and basisu have no apt packages (see the previous
      # step's comment) - vcpkg still builds/fetches just those two, via the
      # minimal manifest in packaging/linux/vendor, not the full vcpkg.json.
      # openimagedenoise's overlay port only repackages prebuilt binaries and
      # basisu is a plain CMake project, so this needs no extra toolchain
      # beyond what's already installed above.
      run: |
        ${{ github.workspace }}/vcpkg/vcpkg install --triplet x64-linux \
          --x-manifest-root=packaging/linux/vendor \
          --x-install-root=packaging/linux/vendor/vcpkg_installed \
          --overlay-ports=overlay-ports \
          --overlay-triplets=vcpkg/triplets

    - name: Create required directories (Windows)
      if: runner.os == 'Windows'
      run: |
        New-Item -ItemType Directory -Force -Path translations, ui, include, src

    - name: Create required directories (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir -p translations ui include src

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DCMAKE_INSTALL_PREFIX=install -G Ninja

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      # No vcpkg toolchain here at all - find_package() resolves Qt6/
      # OpenCASCADE/embree/assimp/etc against the apt packages installed
      # above directly (matches CMakePresets.json's linux_system_* presets,
      # replicated here as raw flags rather than `cmake --preset` to keep
      # this step's build/install directory layout consistent with the
      # Windows leg's steps below, which don't use presets either).
      # CMAKE_PREFIX_PATH only needs to point at the two vendored packages.
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/packaging/linux/vendor/vcpkg_installed/x64-linux/share/basisu;${{ github.workspace }}/packaging/linux/vendor/vcpkg_installed/x64-linux/share/OpenImageDenoise" \
          -DCMAKE_INSTALL_PREFIX=install \
          -G Ninja

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Update translations (optional)
      run: cmake --build build --target update_translations --config ${{ matrix.build_type }}
      continue-on-error: true

    - name: Test
      working-directory: build
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure --parallel

    - name: Install
      run: cmake --install build --prefix install --config ${{ matrix.build_type }}

    - name: Package artifacts (Windows)
      if: runner.os == 'Windows' && matrix.build_type == 'Release'
      run: |
        cmake --build build --target install --config ${{ matrix.build_type }}
        # Qt deployment script will be run automatically during install

    - name: Build Windows installer (Inno Setup)
      if: runner.os == 'Windows' && matrix.build_type == 'Release' && (startsWith(github.ref, 'refs/tags/Release-') || github.event_name == 'workflow_dispatch')
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
          /DMyAppInstallDir="${{ github.workspace }}\install" `
          "${{ github.workspace }}\packaging\windows\mvinstaller.iss"

    - name: Upload Windows installer
      if: runner.os == 'Windows' && matrix.build_type == 'Release' && (startsWith(github.ref, 'refs/tags/Release-') || github.event_name == 'workflow_dispatch')
      uses: actions/upload-artifact@v4
      with:
        name: modelviewer-windows-installer
        path: dist/*.exe
        retention-days: 30

    - name: Build Debian package (cpack)
      if: runner.os == 'Linux' && matrix.build_type == 'Release' && (startsWith(github.ref, 'refs/tags/Release-') || github.event_name == 'workflow_dispatch')
      # CPack's DEB generator packages straight from the CMake install rules
      # (see CMakeLists.txt's "Linux desktop integration ... CPack" section) -
      # it does its own internal install to a staging dir, so it doesn't
      # depend on the separate "install/" tree above, just a configured and
      # built build/ directory.
      working-directory: build
      run: |
        set -e
        cpack -G DEB
        mkdir -p "${{ github.workspace }}/dist"
        mv ./*.deb "${{ github.workspace }}/dist/"

    - name: Upload Debian package
      if: runner.os == 'Linux' && matrix.build_type == 'Release' && (startsWith(github.ref, 'refs/tags/Release-') || github.event_name == 'workflow_dispatch')
      uses: actions/upload-artifact@v4
      with:
        name: modelviewer-linux-deb
        path: dist/*.deb
        retention-days: 30

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: modelviewer-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          install/
          !install/**/*.pdb
          build/translations/*.qm
        retention-days: 30

    - name: Upload translation files
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: translations-${{ matrix.os }}
        path: |
          translations/*.ts
          build/translations/*.qm
        retention-days: 30

    # Opt-in live debugging: only activates when this run was manually
    # dispatched with debug_ssh=true AND something earlier in this specific
    # leg actually failed. Opens an SSH (tmate) session directly on the
    # failed runner so you can inspect the exact failed state (paths,
    # partial builds, vcpkg cache, etc.) instead of waiting through another
    # full run to test a guessed fix.
    - name: Debug via SSH on failure
      if: failure() && github.event.inputs.debug_ssh == 'true'
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
      timeout-minutes: 30

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/Release-')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Windows installer
      uses: actions/download-artifact@v4
      with:
        name: modelviewer-windows-installer
        path: release-assets

    - name: Download Linux Debian package
      uses: actions/download-artifact@v4
      with:
        name: modelviewer-linux-deb
        path: release-assets

    - name: Create/update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: CHANGELOG.md
        files: release-assets/*